name: Pages

# The landing page lives in site/ and has no build step: it is plain HTML with the
# screenshots from docs/screenshots copied in at deploy time, so the repository
# keeps a single copy of every image.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/diagrams/**"
      - "build/icon.png"
      # The version badge is injected from this file, so a release bump must
      # redeploy the page even when nothing else changed.
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble static assets
        run: |
          mkdir -p site/assets site/screenshots site/diagrams
          cp build/icon.png site/assets/icon.png
          cp docs/screenshots/*.png site/screenshots/
          # Diagrams illustrate scenes that cannot be photographed (tiling, a
          # transient overlay); they are committed as SVG so they stay sharp.
          cp docs/diagrams/*.svg site/diagrams/
          # The badge reads package.json so it can never drift from the release.
          version="$(node -p "require('./package.json').version")"
          sed -i "s/__VERSION__/${version}/g" site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # The page is a single HTML file plus images; the default retention is
          # plenty and a short-lived artifact keeps storage trivial.
          retention-days: 3
      - id: deployment
        uses: actions/deploy-pages@v5
