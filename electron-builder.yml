appId: io.github.onefanki.ensemble
productName: Ensemble
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - build/tray.png
  - build/icon.png
  - "!**/*.map"
asarUnpack:
  - resources/**
  # The tray icon is loaded by native code from disk, so it must exist outside asar.
  - build/tray.png
win:
  # Installer only. The portable target is a self-extracting stub that unpacks the
  # whole Electron runtime on every launch, which reads as "this app is slow" and
  # gives users a second exe they cannot tell apart from the installer.
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}-${target}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # No certificate is bought for this project, and electron-builder does not fall
  # back to ad-hoc signing on its own. Apple Silicon refuses to run unsigned arm64
  # code, so opt in explicitly. Ad-hoc still fails Gatekeeper for downloaded dmg
  # files; users clear the quarantine flag once.
  identity: "-"
  # Hardened runtime with an ad-hoc signature rejects Electron's pre-signed
  # frameworks (different Team ID), so it must stay off without notarization.
  hardenedRuntime: false
linux:
  target:
    - AppImage
    - deb
  category: Development
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
npmRebuild: false
publish: null
