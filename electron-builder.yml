appId: io.github.onefanki.ensemble
productName: Ensemble
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - build/tray.png
  - build/icon.png
  - "!**/*.map"
asarUnpack:
  - resources/**
  # The tray icon is loaded by native code from disk, so it must exist outside asar.
  - build/tray.png
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}-${target}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Development
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
npmRebuild: false
publish: null
